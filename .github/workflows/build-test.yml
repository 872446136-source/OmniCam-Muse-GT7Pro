name: build-test

# Full-port test build: the upstream Find X9 Ultra payload and patched libraries are pulled at build
# time (500 MB, deliberately not committed) and every feature is enabled, with no device check.
# Output is a pre-release with the flashable module zip.

on:
  push:
    branches: ['test/full-port']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-test
  cancel-in-progress: true

env:
  # Upstream commit the payload is taken from. Bump it when the fork is re-synced.
  UPSTREAM_SHA: 8f373e10b17c95532a3ff2f41c4777ca797da947
  RELEASE_TAG: full-port-test

jobs:
  full:
    name: full port (payload + native + all hooks)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Android SDK (platform 37, NDK 29, CMake 3.22.1)
        run: |
          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          SDKM=$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | tail -1)
          echo "sdkmanager: $SDKM"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" --install "platforms;android-37.0" || "$SDKM" --install "platforms;android-37.1"
          "$SDKM" --install "build-tools;37.0.0" || "$SDKM" --install "build-tools;36.1.0"
          "$SDKM" --install "ndk;29.0.14206865"
          "$SDKM" --install "cmake;3.22.1"
          ls "$SDK/platforms" "$SDK/build-tools" "$SDK/ndk" "$SDK/cmake"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"

      - name: Fetch the upstream payload
        run: |
          set -eux
          curl -sSL --retry 3 --retry-delay 5 \
            "https://codeload.github.com/benbaobaoshigemi/OmniCam-Muse/tar.gz/${UPSTREAM_SHA}" -o /tmp/upstream.tar.gz
          mkdir -p /tmp/up
          tar xzf /tmp/upstream.tar.gz -C /tmp/up
          UP=$(ls -d /tmp/up/*)
          cp -a "$UP/module/payload" module/payload
          cp -a "$UP/module/system" module/system
          du -sh module/payload module/system
          ls module/system/odm/lib64

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: assembleRelease (with the native library)
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
          ./gradlew :app:assembleRelease --console=plain --stacktrace

      - name: Sign the APK
        run: |
          BUILD_TOOLS=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -1)
          cp app/build/outputs/apk/release/app-release-unsigned.apk unsigned.apk
          "$BUILD_TOOLS/apksigner" sign \
            --ks signing/port.p12 --ks-type PKCS12 \
            --ks-pass pass:omnicam --key-pass pass:omnicam \
            --out OmniCam-Muse-FullPort.apk unsigned.apk
          "$BUILD_TOOLS/apksigner" verify --print-certs OmniCam-Muse-FullPort.apk
          unzip -l OmniCam-Muse-FullPort.apk | grep -E "native_init|libjiege_native" || true

      - name: Package the KernelSU module
        run: |
          cp OmniCam-Muse-FullPort.apk module/omnicam-muse-lite.apk
          python3 tools/zip_module.py module OmniCam-Muse-FullPort-KSU.zip
          unzip -l OmniCam-Muse-FullPort-KSU.zip | head -20
          du -h OmniCam-Muse-FullPort-KSU.zip OmniCam-Muse-FullPort.apk

      - name: Publish the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --prerelease \
              --target "$GITHUB_SHA" \
              --title "Full port test build (GT7 Pro)" \
              --notes-file TEST-BRANCH.md
          fi
          gh release upload "$RELEASE_TAG" OmniCam-Muse-FullPort-KSU.zip OmniCam-Muse-FullPort.apk --clobber
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[] | "\(.name) \(.size)"'
