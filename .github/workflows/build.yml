name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: assemble + sign + module zip
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # The runner image already carries the SDK and its cmdline-tools; android-actions/setup-android
      # asks for the retired "tools" package by default and fails on it, so drive sdkmanager directly.
      # compileSdk = 37 is published as platforms;android-37.0 (minor version), there is no android-37.
      - name: Android SDK
        run: |
          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          SDKM=$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | tail -1)
          echo "sdkmanager: $SDKM"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" --install "platforms;android-37.0" || "$SDKM" --install "platforms;android-37.1"
          "$SDKM" --install "build-tools;37.0.0" || "$SDKM" --install "build-tools;36.1.0"
          "$SDKM" --install "platform-tools" || true
          ls "$SDK/platforms" "$SDK/build-tools"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"

      - name: Strip the native build (Lite ships no native library)
        run: python3 .github/strip_native.py app/build.gradle.kts

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: assembleRelease
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
          ./gradlew :app:assembleRelease --console=plain --stacktrace

      - name: Sign the APK
        run: |
          BUILD_TOOLS=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -1)
          echo "build-tools: $BUILD_TOOLS"
          cp app/build/outputs/apk/release/app-release-unsigned.apk unsigned.apk
          "$BUILD_TOOLS/apksigner" sign \
            --ks signing/port.p12 --ks-type PKCS12 \
            --ks-pass pass:omnicam --key-pass pass:omnicam \
            --out OmniCam-Muse-Lite.apk unsigned.apk
          "$BUILD_TOOLS/apksigner" verify --print-certs OmniCam-Muse-Lite.apk

      - name: Package the KernelSU module
        run: |
          VER=$(sed -n 's/^version=//p' module/module.prop)
          echo "module version: $VER"
          cp OmniCam-Muse-Lite.apk "module/omnicam-muse-$VER.apk"
          python3 tools/zip_module.py module "OmniCam-Muse-$VER-KSU.zip"
          unzip -l "OmniCam-Muse-$VER-KSU.zip"
          ls -la OmniCam-Muse-*.zip OmniCam-Muse-Lite.apk

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: OmniCam-Muse-GT7Pro
          if-no-files-found: error
          path: |
            OmniCam-Muse-*-KSU.zip
            OmniCam-Muse-Lite.apk
